name: Release

# Pushing a tag such as v0.2.0 stages that version on npm. Once a maintainer
# approves it on npmjs.com (which asks for their second factor), it is
# released, and webjars.org deploys it to Maven Central as
# org.webjars.npm:codemirror-lang-groovy.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing authenticates with GitHub's OIDC token

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Use npm 11.15.0 or later, which staged publishing requires
        run: |
          npm install -g npm@latest
          npm --version
      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      # npm ci also runs `prepare`, which generates the parser and builds dist/
      - run: npm ci
      - run: npm test
      # No token: npm accepts the OIDC identity of this workflow, which the
      # package's trusted publisher allows to stage releases but not to
      # publish them directly.
      - run: npm stage publish

  webjar:
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Wait for the release to be approved on npmjs.com
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "Approve codemirror-lang-groovy@$version on npmjs.com; this job deploys the WebJar once it is released."
          for i in $(seq 1 300); do
            if npm view "codemirror-lang-groovy@$version" version >/dev/null 2>&1; then exit 0; fi
            sleep 60
          done
          echo "codemirror-lang-groovy@$version was not released within 5 hours. Re-run this job after approving it."
          exit 1
      - name: Deploy the WebJar
        run: |
          version="${GITHUB_REF_NAME#v}"
          curl --fail --no-progress-meter -X POST \
            "https://www.webjars.org/deploy?webJarType=npm&nameOrUrlish=codemirror-lang-groovy&version=$version" \
            | tee deploy.log
          grep -q 'Deployed!' deploy.log
